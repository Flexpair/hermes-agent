name: Flexpair Linux config regression tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flexpair-linux-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux config and installer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install focused test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Check Linux installer syntax
        run: bash -n scripts/install.sh

      - name: Run Linux configuration and installer regressions
        run: |
          uv run --no-sync python -m pytest -q \
            tests/hermes_cli/test_config.py::TestLoadConfigDefaults::test_returns_defaults_when_no_file \
            tests/hermes_cli/test_config.py::TestEmptyConfigSections::test_null_section_keeps_defaults_in_load_config \
            tests/hermes_cli/test_config_validation.py::TestVoiceSubmitModeValidation::test_default_is_direct \
            tests/scripts/install/test_install_sh_repository_defaults.py
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
