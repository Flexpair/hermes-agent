name: Flexpair Linux config regression tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: flexpair-linux-config-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: Patched installer and update paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install Linux test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Check Linux installer syntax
        run: bash -n scripts/install.sh

      - name: Run focused fork regressions
        run: |
          uv run --no-sync scripts/run_tests.sh \
            tests/hermes_cli/test_flexpair_fixed_install.py \
            tests/hermes_cli/test_update_contract.py \
            tests/hermes_cli/test_update_check.py \
            tests/hermes_cli/test_passive_update_opt_out.py \
            tests/hermes_cli/test_setup_hermes_script.py \
            tests/scripts/install/test_install_sh_repository_defaults.py \
            tests/scripts/desktop_update/test_desktop_update_linux_gate.py
        env:
          HERMES_TEST_WORKERS: "8"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
